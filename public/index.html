<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#3b82f6" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="stylesheet" href="/css/styles.css" />
  <title>ICT Learning Platform - Login</title>
</head>
<body data-page="login">
  <header class="topbar">
    <div class="container"><div class="brand">ICT Learning Platform</div></div>
  </header>

  <main class="auth-wrapper">
    <section class="card auth-card">
      <h1>Sign in</h1>
      <p>Grade 6–13 lessons, activities, and progress in one app.</p>
      <div id="message"></div>
      <form id="loginForm">
        <label for="role">Login As</label>
        <select id="role" name="role">
          <option value="student">Student</option>
          <option value="admin">Admin (Teacher)</option>
        </select>

        <div id="studentIdWrap">
          <label for="studentId">Student ID</label>
          <input type="text" id="studentId" name="studentId" placeholder="e.g., STU-2024-001" required />
        </div>

        <div id="emailWrap" style="display:none;">
          <label for="email">Admin Email</label>
          <input type="email" id="email" name="email" placeholder="teacher@school.edu" />
        </div>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required />

        <button type="submit">Continue</button>
      </form>
    </section>
  </main>

  <script type="module" src="/js/main.js"></script>
</body>
</html>
